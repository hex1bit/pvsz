name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios.yml'
      - 'ios/**'
      - 'CMake/**'
      - 'CMakeLists.txt'
      - 'vcpkg*.json'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: wanzi-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iPhone and iPad (unsigned arm64 IPA)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v6
      - name: Identify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "CLANG_ID=$(clang --version | head -1 | shasum | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"
      - uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: wanzi-ios-${{ runner.arch }}-${{ env.CLANG_ID }}-${{ hashFiles('vcpkg*.json', 'CMake/triplets/arm64-ios.cmake') }}
          restore-keys: |
            wanzi-ios-${{ runner.arch }}-${{ env.CLANG_ID }}-
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
          vcpkgGitCommitId: e8709ee8703328fe121eab33cda73a406a7626b7
      - name: Build and package
        run: bash ios/build-ios.sh Release
      - name: Verify package
        run: |
          unzip -t build-ios/wanzi-family-ios-arm64-unsigned.ipa
          plutil -p build-ios/game/Release-iphoneos/pvz-portable.app/Info.plist
          cat build-ios/build-info.txt
          cat build-ios/SHA256SUMS.txt
          printf '### WanZi Family iOS build\n\nUnsigned IPA for iPhone and iPad, minimum OS 16.4. Signing is required before installation. Original game resources are not included.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: wanzi-family-ios-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            build-ios/wanzi-family-ios-arm64-unsigned.ipa
            build-ios/SHA256SUMS.txt
            build-ios/build-info.txt
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wanzi-ios-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build-ios/game/CMakeFiles/CMakeConfigureLog.yaml
            build-ios/game/vcpkg-manifest-install.log
